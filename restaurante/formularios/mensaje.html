<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juan Manuel Sandoval Pito">
    <meta name="description" content="Formulario de contacto con el restaurante El Sabor Andaluz">
    <meta name="keywords" content="contacto, mensaje, restaurante, El Sabor Andaluz, formulario">
    <title>Contacto</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
</head>
<body>
    <header>
        <h1>Envíenos su mensaje</h1>
    </header>
    <nav>
        <a href="../index.html">Volver al menú</a>
    </nav>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Contacto</legend>
                <input type="text" name="nombre" placeholder="Su nombre">
                <input type="email" name="email" placeholder="Su correo electrónico">
                <input type="text" name="telefono" placeholder="Su teléfono"><br><br>
                <input type="text" name="asunto" placeholder="Asunto" size="70"><br><br>
                <textarea name="mensaje" rows="10" cols="60" maxlength="500" placeholder="Su mensaje"></textarea><br>
                Máximo 500 caracteres
            </fieldset>
            <br>
            <input type="submit" value="ENVIAR">
        </form>
    </main>
    <footer>© 2026</footer>
</body>
</html>
